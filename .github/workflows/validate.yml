name: Validate StructMark VS Code

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/language-server/package-lock.json
            packages/vscode/package-lock.json
      - name: Install core dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify v2 ESM contract and VS Code static assets
        run: npm run check:v2
      - name: Verify v1 compatibility suite
        run: npm test
      - name: Install language-server dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/language-server
      - name: Build language-server
        run: npm run build
        working-directory: packages/language-server
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages/vscode
      - name: Build extension
        run: npm run build
        working-directory: packages/vscode
      - name: Prepare portable server and verify runtime layout
        run: npm run prepare:vscode && node scripts/validate-vscode-assets.mjs --packaged
